services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      DOMAIN: ${DOMAIN}
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/app
    depends_on:
      - db
    volumes:
      - staticfiles:/app/static
      - media:/app/media
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    depends_on:
      - django
    ports:
      - "80"
    volumes:
      - staticfiles:/static:ro
      - media:/media
      - type: bind
        source: ./_coolify/nginx-default.conf
        target: /etc/nginx/conf.d/default.conf
        content: |
          server {
            listen 80;
            server_name _;

            # Redirect nur für echte HTTP-Requests (kommt von Traefik)
            if ($http_x_forwarded_proto = "http") {
              return 301 https://$host$request_uri;
            }

            location /static/ { alias /static/; expires 30d; access_log off; }
            location /media/  { alias /media/;  expires 7d;  access_log off; }

            location / {
              proxy_pass http://django:8000;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
          }

volumes:
  postgres_data:
  staticfiles:
  media:
